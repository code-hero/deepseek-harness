name: Package Desktop for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Windows x64 NSIS installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DeepSeek Harness runtime
        run: pnpm run build

      - name: Build Windows installer
        run: pnpm --dir apps/desktop run bundle:windows

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
